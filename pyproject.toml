[project]
name = "nca"
version = "0.1.0"
description = "Experimental Neural Computer Agent: independently trained modules composed by a cognitive microkernel"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["torch>=2.4", "torchvision>=0.19"]

[project.entry-points."nca.packages"]
"nca.arithmetic" = "nca.domains.arithmetic.package:arithmetic"
"nca.formulas" = "nca.domains.boolean.package:formulas"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nca"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Every function is fully type-annotated (Any is allowed where values are opaque);
# no unused imports or variables.
select = ["ANN", "E731", "F401", "F821", "F841"]
ignore = ["ANN401"]
