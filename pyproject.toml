[project]
name = "nca"
version = "0.1.1"
description = "Experimental Neural Computer Agent: independently trained modules composed by a cognitive microkernel"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "torch>=2.4"]

[project.optional-dependencies]
trust = ["cryptography>=42"]

[project.scripts]
elisa-agent = "nca.agents:main"

[project.entry-points."nca.loaders"]
# Stable identifiers stored in primitive entries, then the import paths
# that earlier artifacts stored, as aliases of the same factories.
"nca/decoder@1" = "nca.learning.discovery:_load_decoder"
"nca/joint@1" = "nca.learning.acquisition_objects:load_joint"
"nca/composition@1" = "nca.learning.acquisition_objects:load_composition"
"nca/correction@1" = "nca.learning.acquisition_objects:load_correction"
"nca/application@1" = "nca.learning.acquisition_objects:load_application"
"nca/export@1" = "nca.learning.export_objects:load_export"
"nca/affine@1" = "nca.learning.affine:load_affine"
"nca/vector-affine@1" = "nca.learning.vector:load_vector_affine"
"nca/tree@1" = "nca.learning.tree_objects:load_tree"
"nca/regional@1" = "nca.learning.regional_objects:load_regional"
"nca/regional-policy@1" = "nca.learning.regional_objects:load_policy"
"nca/partition@1" = "nca.learning.numeric_objects:load_partition"
"nca/regions@1" = "nca.learning.numeric_objects:load_regions"
"nca/projection@1" = "nca.learning.numeric_objects:load_projection"
"nca/polynomial@1" = "nca.learning.numeric_objects:load_polynomial"
"nca/prototypes@1" = "nca.learning.numeric_objects:load_prototypes"
"nca.discovery:_load_decoder" = "nca.learning.discovery:_load_decoder"
"nca.acquisition_objects:load_joint" = "nca.learning.acquisition_objects:load_joint"
"nca.acquisition_objects:load_composition" = "nca.learning.acquisition_objects:load_composition"
"nca.affine_learning:load_affine" = "nca.learning.affine:load_affine"
"nca.vector_learning:load_vector_affine" = "nca.learning.vector:load_vector_affine"
"nca.tree_objects:load_tree" = "nca.learning.tree_objects:load_tree"
"nca.regional_objects:load_regional" = "nca.learning.regional_objects:load_regional"
"nca.regional_objects:load_policy" = "nca.learning.regional_objects:load_policy"
"nca.numeric_objects:load_partition" = "nca.learning.numeric_objects:load_partition"
"nca.numeric_objects:load_regions" = "nca.learning.numeric_objects:load_regions"
"nca.numeric_objects:load_projection" = "nca.learning.numeric_objects:load_projection"
"nca.numeric_objects:load_polynomial" = "nca.learning.numeric_objects:load_polynomial"
"nca.numeric_objects:load_prototypes" = "nca.learning.numeric_objects:load_prototypes"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nca"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Every function is fully type-annotated (Any is allowed where values are opaque);
# no unused imports or variables.
select = ["ANN", "E731", "F401", "F821", "F841"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
# Preserve fixture-module identities across subsystem test directories.
pythonpath = [
    "tests/planner",
    "tests/runtime",
    "tests/objects",
    "tests/decoding",
    "tests/evidence",
    "tests/learning",
    "tests/retention",
    "tests/memory",
    "tests/native",
]
