[project]
name = "nca"
version = "0.1.0"
description = "Experimental Neural Computer Agent: independently trained modules composed by a cognitive microkernel"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["torch>=2.4", "torchvision>=0.19"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nca"]
